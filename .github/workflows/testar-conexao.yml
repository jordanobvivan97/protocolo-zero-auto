name: Testar conexao (so leitura)

# Roda quando o arquivo .github/testar muda, ou pelo botão Run workflow. Não publica nada.
on:
  push:
    branches: [main]
    paths: [".github/testar"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/testar_conexao.py
      - run: |
          git config user.name "agente-pz"
          git config user.email "agente-pz@users.noreply.github.com"
          git add metricas/teste-conexao.json
          git diff --cached --quiet || (git commit -m "Teste de conexao $(date -u +%F' '%H:%M) UTC" && git pull --rebase origin main && git push)
