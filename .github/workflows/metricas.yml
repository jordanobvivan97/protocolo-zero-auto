name: Metricas

on:
  schedule:
    - cron: "23 10 * * *"   # 07h23 de Brasília
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/metricas.py
      - run: |
          git config user.name "agente-pz"
          git config user.email "agente-pz@users.noreply.github.com"
          git add metricas
          git diff --cached --quiet || (git commit -m "Metricas $(date -u +%F)" && git pull --rebase origin main && git push)
